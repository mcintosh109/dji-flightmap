<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Flight Map</title>
  <!-- Everything is inside this one file, because nothing else can load before you sign in. -->
  <style>
    :root {
      --bg: #0c0e12; --card: #14171d; --field: #1c2028; --line: rgba(255,255,255,0.1);
      --text: #e9ecf1; --muted: #9097a3; --accent: #36c2ff; --error: #ff6b6b;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(1200px 600px at 50% -10%, #12324a 0%, var(--bg) 60%);
      color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 360px; padding: 28px 24px;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .mark {
      width: 48px; height: 48px; border-radius: 14px; margin-bottom: 16px;
      display: grid; place-items: center; background: rgba(54,194,255,0.16); color: var(--accent);
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 10px; font: inherit; color: inherit;
      background: var(--field); border: 1px solid var(--line); outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: #04121a; font: inherit; font-weight: 650;
    }
    button:hover { filter: brightness(1.08); }
    .error { display: none; margin: 0 0 4px; color: var(--error); font-size: 14px; }
    .error.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="28" height="28"><g fill="currentColor"><circle cx="12" cy="12" r="6"/><circle cx="36" cy="12" r="6"/><circle cx="12" cy="36" r="6"/><circle cx="36" cy="36" r="6"/><rect x="18" y="18" width="12" height="12" rx="3"/></g></svg>
    </div>
    <h1>Flight Map</h1>
    <p>Sign in to see your flights.</p>
    <p class="error" id="error" role="alert"></p>
    <form method="post" action="/api/login">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script>
    // Show a message if the server sent us back here after a failed attempt.
    const reason = new URLSearchParams(location.search).get('error');
    if (reason) {
      const box = document.getElementById('error');
      box.textContent = reason === 'locked'
        ? 'Too many wrong attempts. Please wait 15 minutes and try again.'
        : 'Wrong username or password.';
      box.classList.add('show');
    }
  </script>
</body>
</html>
